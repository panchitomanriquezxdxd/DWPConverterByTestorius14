name: Compilar Android y Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar web y generar proyecto Android
        run: |
          npm run prepare:web
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0d1116' --iconBackgroundColorDark '#0d1116'
          npx cap sync android

      - name: Usar solo el ícono propio (quitar el de la plantilla de Capacitor)
        run: |
          RES=android/app/src/main/res
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml" "$RES/drawable/ic_launcher_background.xml" "$RES/values/ic_launcher_background.xml"
          for n in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$n.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done

      - name: Compilar APK (debug, instalable directamente)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verificar nombre e ícono dentro del APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "--- aapt2 dump badging ---"
          "$AAPT2" dump badging "$APK" | grep -E "^(package|application:|application-label:|application-icon)" || true
          echo "--- XML del ícono adaptable (debe apuntar a @mipmap) ---"
          "$AAPT2" dump xmltree --file res/mipmap-anydpi-v26/ic_launcher.xml "$APK" || true
          echo "--- archivos de ícono ---"
          unzip -l "$APK" | grep -E "ic_launcher" || echo "NO HAY ARCHIVOS ic_launcher EN EL APK"

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DWPMaker-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DWPMaker-android
          path: DWPMaker-android.apk

  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Compilar Windows (instalador + portable)
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: DWPMaker-windows
          path: |
            dist-win/*.exe

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.exe
