name: Compilar Android y Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar web y generar proyecto Android
        run: |
          npm run prepare:web
          npx cap add android
          npx cap sync android

      - name: Compilar APK (debug, instalable directamente)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WavADWP-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WavADWP-android
          path: WavADWP-android.apk

  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Compilar Windows (instalador + portable)
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: WavADWP-windows
          path: |
            dist-win/*.exe

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.exe
