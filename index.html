<style>
/* Concepto: una hoja de laboratorio de audio. Forma de onda como protagonista, marcadores en ámbar, notas en monoespaciada. */
:root {
  --bg: #edf0f3; --surface: #ffffff; --ink: #141a21; --muted: #55606d; --line: #d3dae2;
  --accent: #0a6c88; --accent-ink: #ffffff; --accent-soft: #dcecf1;
  --mark: #b9520a; --wave: #0a6c88; --ok: #1d7448; --err: #b3261e; --field: #f7f9fb;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --surface: #151b23; --ink: #e8ecf1; --muted: #9ba6b3; --line: #2a323d;
    --accent: #5cc4de; --accent-ink: #06222b; --accent-soft: #17303a;
    --mark: #f0a35c; --wave: #5cc4de; --ok: #62c78f; --err: #ff8a80; --field: #0f141b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #151b23; --ink: #e8ecf1; --muted: #9ba6b3; --line: #2a323d;
  --accent: #5cc4de; --accent-ink: #06222b; --accent-soft: #17303a;
  --mark: #f0a35c; --wave: #5cc4de; --ok: #62c78f; --err: #ff8a80; --field: #0f141b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font: 700 2rem/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font: 600 0.78rem/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 52ch; margin-top: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.step-head { display: flex; align-items: baseline; gap: 10px; }
.step-n { font: 500 0.8rem var(--font-mono); color: var(--accent); }
button, .btn {
  font: 600 1rem/1 var(--font-body); min-height: 48px; padding: 0 20px; border-radius: 8px; border: 1px solid transparent;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
button.secondary, .btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, .btn:focus-within, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.btn { position: relative; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 0.82rem var(--font-mono); color: var(--muted); }
.facts b { color: var(--ink); font-weight: 500; }
.fname { font-weight: 600; overflow-wrap: anywhere; }
.scope { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--field); overflow: hidden; }
.scope canvas { display: block; width: 100%; height: 136px; }
.badge { position: absolute; right: 8px; bottom: 8px; font: 600 0.68rem var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 99px; }
.badge[hidden] { display: none; }
.caption { font-size: 0.85rem; color: var(--muted); }
.regions { list-style: none; margin: 0; padding: 0; max-height: 15.5rem; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.regions li, .regions-head { display: grid; grid-template-columns: 4.6rem 1fr 1fr 2.4rem; gap: 8px; padding: 8px 12px; align-items: center; }
.regions li + li { border-top: 1px solid var(--line); }
.regions-head { font: 600 0.7rem var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0 12px 6px; }
.note { font: 500 0.85rem var(--font-mono); color: var(--mark); }
.t { font: 500 0.82rem var(--font-mono); color: var(--ink); }
label.lbl { font-weight: 600; font-size: 0.95rem; }
select { width: 100%; min-height: 48px; padding: 0 12px; font: 500 1rem var(--font-body); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; }
select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type=text] { width: 100%; min-height: 48px; padding: 0 14px; font: 500 1rem var(--font-body); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; }
code { font: 500 0.82rem var(--font-mono); background: var(--accent-soft); color: var(--ink); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.msg { font-size: 0.92rem; min-height: 1.4em; }
.msg.err { color: var(--err); font-weight: 500; }
.msg.warn { color: var(--mark); }
.result { border-top: 1px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.result[hidden] { display: none; }
.ok { color: var(--ok); font-weight: 600; overflow-wrap: anywhere; }
progress { width: 100%; height: 6px; accent-color: var(--accent); }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 18px; }
summary { cursor: pointer; font-weight: 600; min-height: 48px; display: flex; align-items: center; }
details p { padding-bottom: 16px; color: var(--muted); font-size: 0.92rem; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 0.92rem; min-height: 44px; cursor: pointer; }
.check[hidden] { display: none; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
.scope canvas { touch-action: pan-y; cursor: crosshair; }
.regions .x { min-height: 36px; min-width: 36px; padding: 0; font-size: 1.1rem; background: transparent; color: var(--muted); border: 1px solid var(--line); }
.mk { padding: 0 14px; }
.mk-body { display: flex; flex-direction: column; gap: 14px; padding-bottom: 16px; }
.mk-body .grp { display: flex; flex-direction: column; gap: 8px; }
.mk-body .row > * { flex: 1 1 8rem; }
input[type=number] { width: 100%; min-height: 48px; padding: 0 12px; font: 500 1rem var(--font-body); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; }
.mk-body p { padding: 0; }
.foot { font-size: 0.8rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { button { transition: filter .12s; } button:hover:not(:disabled) { filter: brightness(1.08); } }
.langbar { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.langbar select { width: auto; min-height: 40px; font-size: 0.92rem; }
</style>
</head>
<body>

<main class="wrap">
  <header>
    <div class="langbar"><select id="lang" data-i18n-aria="langLabel"></select></div>
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
  </header>

  <section class="card" aria-labelledby="h-file">
    <div class="step-head"><span class="step-n">1</span><h2 id="h-file" data-i18n="stepFile"></h2></div>
    <div class="row">
      <label class="btn" id="pick"><span data-i18n="pick"></span><input id="file" type="file" accept="audio/*,video/mp4,.wav,.mp3,.ogg,.oga,.opus,.m4a,.aac,.flac,.aif,.aiff,.wma,.mp4,.webm,.caf"></label>
    </div>
    <div id="info" class="facts" hidden></div>
    <div class="scope"><canvas id="scope" role="img" data-i18n-aria="scopeAria"></canvas><span class="badge" id="demoBadge" data-i18n="badgeDemo"></span></div>
    <p class="caption" id="scopeCap"></p>
    <div>
      <div class="regions-head"><span data-i18n="colNote"></span><span data-i18n="colFrom"></span><span data-i18n="colDur"></span><span></span></div>
      <ul class="regions" id="regions" data-i18n-aria="regionsAria"></ul>
    </div>
    <details class="mk" id="mk">
      <summary data-i18n="mkSummary"></summary>
      <div class="mk-body">
        <p class="caption" data-i18n="mkHelp"></p>
        <div class="grp">
          <label class="lbl" for="mkSens" data-i18n="mkSensLbl"></label>
          <div class="row"><select id="mkSens"><option value="hi" data-i18n="sensHi"></option><option value="mid" data-i18n="sensMid" selected></option><option value="lo" data-i18n="sensLo"></option></select><button class="secondary" id="mkDetect" data-i18n="mkDetect" disabled></button></div>
        </div>
        <div class="grp">
          <label class="lbl" for="mkN" data-i18n="mkEqualLbl"></label>
          <div class="row"><input id="mkN" type="number" min="2" max="128" value="16" inputmode="numeric"><button class="secondary" id="mkEqual" data-i18n="mkEqual" disabled></button></div>
        </div>
        <div class="grp">
          <label class="lbl" for="mkMs" data-i18n="mkMsLbl"></label>
          <div class="row"><button class="secondary" id="mkBack" data-i18n="mkBack" data-i18n-aria="mkBackAria" disabled></button><input id="mkMs" type="number" min="1" max="2000" value="35" inputmode="numeric"><button class="secondary" id="mkFwd" data-i18n="mkFwd" data-i18n-aria="mkFwdAria" disabled></button></div>
        </div>
        <div class="row"><button class="secondary" id="mkClear" data-i18n="mkClear" disabled></button><button class="secondary" id="mkRestore" data-i18n="mkRestore" disabled></button></div>
      </div>
    </details>
    <label class="check" id="introRow" hidden><input type="checkbox" id="intro"><span id="introText"></span></label>
  </section>

  <section class="card" aria-labelledby="h-name">
    <div class="step-head"><span class="step-n">2</span><h2 id="h-name" data-i18n="stepName"></h2></div>
    <label class="lbl" for="pname" data-i18n="nameLbl"></label>
    <input id="pname" type="text" maxlength="40" value="" data-i18n-ph="namePh" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="caption" id="nameHint"></p>
  </section>

  <section class="card" aria-labelledby="h-make">
    <div class="step-head"><span class="step-n">3</span><h2 id="h-make" data-i18n="stepMake"></h2></div>
    <label class="lbl" for="quality" data-i18n="qualityLbl"></label>
    <select id="quality">
      <option value="hi" data-i18n="qHi"></option>
      <option value="std" data-i18n="qStd" selected></option>
      <option value="lo" data-i18n="qLo"></option>
      <option value="min" data-i18n="qMin"></option>
    </select>
    <p class="caption" id="sizeEst"></p>
    <label class="check"><input type="checkbox" id="optTrim" checked><span data-i18n="optTrim"></span></label>
    <label class="check"><input type="checkbox" id="optLoop" checked><span data-i18n="optLoop"></span></label>
    <p class="caption" data-i18n="loopNote"></p>
    <div class="row"><button id="make" data-i18n="make" disabled></button></div>
    <progress id="prog" max="1" value="0" hidden></progress>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div class="result" id="result" hidden>
      <p class="ok" id="okline"></p>
      <div class="row"><button id="save" data-i18n="saveDwp"></button></div>
      <p class="caption" id="saveNote"></p>
    </div>
  </section>

  <details>
    <summary data-i18n="howSummary"></summary>
    <p data-i18n="howText"></p>
  </details>
  <p class="foot" data-i18n="foot"></p>
</main>

<script>
/* Núcleo WAV (con markers) -> DirectWave .dwp. Sin dependencias. */
const W2D = (function () {
  'use strict';
  let L = (k) => k;   /* traductor: lo inyecta la app con W2D.setTranslator */
  const err = (key, params) => Object.assign(new Error(L(key, params)), { key, params });
  const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const GUARD = 256, TAIL = 1024, FADE = 32, MAX_REGIONS = 128, BASE_NOTE = 60;

  const noteName = (n) => NOTES[n % 12] + Math.floor(n / 12);

  /* -------- utilidades binarias -------- */
  function b64(s) {
    const bin = atob(s), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function ascii(str) { const o = new Uint8Array(str.length); for (let i = 0; i < str.length; i++) o[i] = str.charCodeAt(i) & 0x7f; return o; }
  function chunk(tag, data) {
    const h = new Uint8Array(12), dv = new DataView(h.buffer);
    dv.setUint32(0, tag, true); dv.setUint32(4, data.length, true); dv.setUint32(8, 0, true);
    const out = new Uint8Array(12 + data.length); out.set(h, 0); out.set(data, 12); return out;
  }
  function chunkHeader(tag, size) {
    const h = new Uint8Array(12), dv = new DataView(h.buffer);
    dv.setUint32(0, tag, true); dv.setUint32(4, size, true); dv.setUint32(8, 0, true); return h;
  }
  function concat(parts) {
    let n = 0; for (const p of parts) n += p.length;
    const out = new Uint8Array(n); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out;
  }
  function roundHalfEven(x) {
    const f = Math.floor(x), d = x - f;
    if (d < 0.5) return f; if (d > 0.5) return f + 1; return f % 2 === 0 ? f : f + 1;
  }

  /* -------- nombres -------- */
  function cleanName(s) {
    s = (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\.[A-Za-z0-9]{1,4}$/, '');
    s = s.replace(/[^A-Za-z0-9 _-]+/g, '_').replace(/\s+/g, ' ').trim().slice(0, 40).trim();
    return s || 'DWPMaker';
  }

  /* -------- lectura de WAV -------- */
  function parseWav(buf) {
    const dv = new DataView(buf), len = buf.byteLength;
    const tag = (o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
    if (len < 44 || tag(0) !== 'RIFF' || tag(8) !== 'WAVE') throw err('errNotWav');
    let pos = 12, fmt = null, dataOff = -1, dataLen = 0, cues = [];
    while (pos + 8 <= len) {
      const id = tag(pos); let size = dv.getUint32(pos + 4, true); const body = pos + 8;
      if (body + size > len) size = len - body;
      if (id === 'fmt ' && size >= 16) {
        let t = dv.getUint16(body, true);
        if (t === 0xfffe && size >= 26) t = dv.getUint16(body + 24, true);
        fmt = { tag: t, channels: dv.getUint16(body + 2, true), rate: dv.getUint32(body + 4, true), bits: dv.getUint16(body + 14, true) };
      } else if (id === 'data') { dataOff = body; dataLen = size; }
      else if (id === 'cue ' && size >= 4) {
        const n = dv.getUint32(body, true);
        for (let i = 0; i < n && 4 + (i + 1) * 24 <= size; i++) {
          const p = body + 4 + i * 24;
          const position = dv.getUint32(p + 4, true), sampleOffset = dv.getUint32(p + 20, true);
          cues.push(sampleOffset || position);
        }
      }
      pos = body + size + (size & 1);
    }
    if (!fmt || dataOff < 0) throw err('errNoFmt');
    const ok = (fmt.tag === 1 && [8, 16, 24, 32].includes(fmt.bits)) || (fmt.tag === 3 && [32, 64].includes(fmt.bits));
    if (!ok) throw err('errUnsupported', { bits: fmt.bits, type: fmt.tag });
    if (fmt.channels < 1) throw err('errNoChannels');
    const frameBytes = fmt.channels * fmt.bits / 8;
    const frames = Math.floor(dataLen / frameBytes);
    if (frames < 1) throw err('errNoAudio');
    const info = { buf, fmt, dataOff, frames, frameBytes };
    const set = [...new Set(cues.filter((c) => c < frames))].sort((a, b) => a - b);
    info.markers = set;
    info.introFrames = set.length && set[0] > 0 ? set[0] : 0;   /* audio anterior al primer marker */
    info.includeIntro = false;                                   /* por defecto se ignora, sin región extra */
    info.read = makeReader(info);
    return info;
  }
  /* devuelve el valor de la muestra en escala "entero de 16 bits x 2^k" (la escala exacta no importa: se normaliza) */
  function makeReader(info) {
    const dv = new DataView(info.buf), { tag, bits, channels } = info.fmt, bps = bits / 8;
    return function (frame, ch) {
      const o = info.dataOff + (frame * channels + Math.min(ch, channels - 1)) * bps;

      state.orig = info.markers.slice(); renderFacts();
      el.badge.hidden = true;
      if (!el.pname.value) el.pname.value = W2D.cleanName(file.name);
      el.intro.checked = false; limitQuality(info.fmt.rate);
      [el.mkDetect, el.mkEqual, el.mkBack, el.mkFwd].forEach((b) => { b.disabled = false; });
      el.mk.open = info.markers.length === 0;
      el.mkClear.disabled = info.markers.length === 0; el.mkRestore.disabled = true;
      syncIntro(); refreshPlan();
      el.make.disabled = false;
    } catch (e) {
      state = null; el.introRow.hidden = true; [el.mkDetect, el.mkEqual, el.mkClear, el.mkRestore, el.mkBack, el.mkFwd].forEach((b) => { b.disabled = true; }); showDemo(); el.info.hidden = true; el.cap.textContent = t('demoCap');
      sayErr(e);
    }
  }
  el.file.addEventListener('change', () => loadFile(el.file.files[0]));
  ['dragover', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); if (ev === 'drop' && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); }));

  /* ---------- crear ---------- */
  el.make.addEventListener('click', () => {
    if (!state) return;
    resetResult(); el.make.disabled = true; el.prog.hidden = false; el.prog.value = 0; say('creating');
    setTimeout(async () => {
      try {
        const out = await W2D.buildDwp(state.info, el.pname.value, TPL, (p) => { el.prog.value = p; }, Object.assign(currentOpts(), { yield: true }));
        const blob = new Blob(out.parts, { type: 'application/octet-stream' });
        built = { blob, parts: out.parts, filename: out.name + '.dwp', regions: out.regions.length, loops: out.loops, trimmed: out.trimmed, qo: currentOpts(), rate: state.info.fmt.rate, size: blob.size };
        el.prog.hidden = true;
        renderOk();
        el.result.hidden = false; setSaveUi(); say('done');
      } catch (e) { el.prog.hidden = true; if (e && e.key) sayErr(e); else sayRaw((e && e.message) || t('createFail'), 'err'); }
      el.make.disabled = false;
    }, 30);
  });

  /* ---------- guardar ---------- */
  function renderOk() {
    const b = built, qo = b.qo, extra = [];
    if (qo.rateDiv > 1) extra.push(fmtKhz(b.rate / qo.rateDiv));
    if (qo.loop) extra.push(b.loops === 0 ? t('loopsNone') : tn('loopCount', b.loops));
    if (qo.trim && b.trimmed) extra.push(tn('trimmedCount', b.trimmed));
    el.okline.textContent = b.filename + ' · ' + tn('regCount', b.regions) + (extra.length ? ' (' + extra.join(', ') + ')' : '') + ' · ' + fmtSize(b.size);
  }
  function setSaveUi() {
    if (dl) { el.save.textContent = t('saveZip'); el.saveNote.textContent = t('saveZipNote'); }
    else { el.save.textContent = t('saveDwp'); el.saveNote.textContent = t('saveNote'); }
  }
  el.save.addEventListener('click', async () => {
    if (!built) return;
    if (dl) {
      try { await dl.save({ filename: built.filename.replace(/\.dwp$/, '') + '.zip', data: new Blob(W2D.zipStore(built.filename, built.parts), { type: 'application/zip' }) }); say('saved'); }
      catch (e) { const no = e && e.code === 'declined'; say(no ? 'cancelled' : 'saveFail', null, no ? '' : 'err'); }
      return;
    }
    /* App Android (Capacitor): el WebView no descarga blobs, se guarda en caché y se abre el menú Compartir/Guardar */
    const cap = window.Capacitor, P = cap && cap.Plugins;
    if (cap && cap.isNativePlatform && cap.isNativePlatform() && P && P.Filesystem && P.Share) {
      try {
        const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(built.blob); });
        const f = await P.Filesystem.writeFile({ path: built.filename, data: b64, directory: 'CACHE' });
        await P.Share.share({ title: built.filename, url: f.uri, dialogTitle: t('shareTitle') });
        say('savedNative');
      } catch (e) { const no = e && /cancel/i.test(String(e.message || e)); say(no ? 'cancelled' : 'saveFail', null, no ? '' : 'err'); }
      return;
    }
    const url = URL.createObjectURL(built.blob), a = document.createElement('a');
    a.href = url; a.download = built.filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000); say('dlStarted');
  });
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then((d) => { dl = d || null; if (built) setSaveUi(); }).catch(() => {}); } catch (e) {}

  /* ---------- idioma ---------- */
  function renderLang() {
    applyStatic(); el.lang.value = lang;
    if (state) { renderFacts(); syncIntro(); renderPlan(); }
    else { el.cap.textContent = t('demoCap'); updateHint(); updateEstimate(); }
    if (built) { renderOk(); setSaveUi(); }
    if (lastSay) show(t(lastSay.key, lastSay.p), lastSay.kind);
  }
  for (const [code, name] of Object.entries(LANGS)) { const o = document.createElement('option'); o.value = code; o.textContent = name; el.lang.appendChild(o); }
  el.lang.addEventListener('change', () => {
    lang = I18N[el.lang.value] ? el.lang.value : 'en';
    try { localStorage.setItem(LS_KEY, lang); } catch (e) {}
    renderLang();
  });
  showDemo(); say('pickFile'); renderLang();
})();
</script>

</body>
</html>
